<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baymax</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Baymax</h1>
      <span class="status" id="status">offline</span>
    </header>
    <div class="transcript" id="transcript">
      <div class="message assistant">
        <span class="label">Baymax</span>
        <p>Connecting...</p>
      </div>
    </div>
    <div class="controls">
      <div class="input-row">
        <input type="text" id="textInput" placeholder="Type a message..." autocomplete="off" />
        <button id="sendBtn" onclick="sendText()">Send</button>
      </div>
      <button id="micBtn" onclick="toggleMic()">
        <span id="micIcon">🎙️</span>
        <span id="micLabel">Hold to speak</span>
      </button>
      <p class="hint" id="hint">Click the mic and speak, or type below</p>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
